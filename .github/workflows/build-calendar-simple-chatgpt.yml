name: Build Calendario Simple ChatGPT

on:
  push:
    branches:
      - chatgpt-calendar-simple-build
    paths:
      - 'chatgpt-calendar-simple/**'
      - '.github/workflows/build-calendar-simple-chatgpt.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'chatgpt-calendar-simple/**'
      - '.github/workflows/build-calendar-simple-chatgpt.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt-calendar-simple-build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        working-directory: chatgpt-calendar-simple
        run: gradle :app:assembleDebug --stacktrace

      - name: APK checksum
        working-directory: chatgpt-calendar-simple
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Calendario-Simple-1.0.0-debug
          path: chatgpt-calendar-simple/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK on build branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p build-artifacts
          cp chatgpt-calendar-simple/app/build/outputs/apk/debug/app-debug.apk build-artifacts/Calendario-Simple-1.0.0-debug.apk
          sha256sum build-artifacts/Calendario-Simple-1.0.0-debug.apk > build-artifacts/Calendario-Simple-1.0.0-debug.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-artifacts/Calendario-Simple-1.0.0-debug.apk build-artifacts/Calendario-Simple-1.0.0-debug.sha256
          if git diff --cached --quiet; then
            echo 'APK unchanged; nothing to publish.'
          else
            git commit -m 'ci: publish Calendario Simple APK'
            git push origin HEAD:chatgpt-calendar-simple-build
          fi
