name: Build SalaRemote APK v2

on:
  push:
    branches: [build-salaremote-caixun]
    paths:
      - 'tmp_salaremote/**'
      - '.github/workflows/build-salaremote-v2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Reconstruct source
        run: |
          cat tmp_salaremote/source_*.txt | base64 -d > SalaRemote_Android_Source.zip
          unzip -o SalaRemote_Android_Source.zip || true
          cp tmp_salaremote/AndroidTvRemoteClient.java SalaRemote/app/src/main/java/cl/javier/salaremote/net/AndroidTvRemoteClient.java
          test -f SalaRemote/app/src/main/java/cl/javier/salaremote/MainActivity.java
      - name: Build debug APK
        working-directory: SalaRemote
        run: gradle --no-daemon assembleDebug
      - name: Collect APK
        run: cp SalaRemote/app/build/outputs/apk/debug/app-debug.apk SalaRemote-Caixun.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SalaRemote-Caixun-APK
          path: SalaRemote-Caixun.apk
          if-no-files-found: error
